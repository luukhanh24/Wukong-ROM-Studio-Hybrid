name: Telegram Mini App · Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Vercel deployment target"
        required: true
        type: choice
        options: [preview, production]
        default: preview
      api_url:
        description: "API origin for the candidate (leave empty for the target default)"
        required: false
        type: string
        default: ""
      release_sha:
        description: "Exact commit SHA to build and promote"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: telegram-mini-app-vercel-production
  cancel-in-progress: true

env:
  TARGET: ${{ inputs.target || 'preview' }}
  WUKONG_TELEGRAM_MINI_APP_API_URL: ${{ inputs.api_url || (inputs.target == 'preview' && vars.WUKONG_CLOUDFLARE_STAGING_URL) || vars.WUKONG_TELEGRAM_MINI_APP_API_URL || 'https://wukong-control-plane.wukong-rom-studio-api.workers.dev' }}
  WUKONG_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and deploy private Mini App
    runs-on: ubuntu-24.04
    environment:
      name: vercel-${{ inputs.target || 'preview' }}
      url: https://wukong-rom-studio.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate private deployment settings
        id: deployment-mode
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$WUKONG_TELEGRAM_MINI_APP_API_URL" ]]
          [[ "$WUKONG_TELEGRAM_MINI_APP_API_URL" == https://* ]]
          [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]] || {
            echo "VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are required; Git Integration auto-deploy is disabled." >&2
            exit 2
          }
          echo "mode=cli" >> "$GITHUB_OUTPUT"
      - name: Install pinned Vercel CLI
        if: steps.deployment-mode.outputs.mode == 'cli'
        run: npm install --global vercel@59.5.0
      - name: Build production bundle locally
        env:
          WUKONG_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix telegram_mini_app
          npm test --prefix telegram_mini_app
          python -m tools.build_vercel_mini_app
          legacy_github_owner='luukhan''h24'
          legacy_cloudflare_handle='luuxuank''hanh98'
          repository_name="${GITHUB_REPOSITORY#*/}"
          ! grep -R -Ei \
            "github\.com|github\.io|${GITHUB_REPOSITORY_OWNER}|${repository_name}|${legacy_github_owner}|${legacy_cloudflare_handle}|DATABASE_URL|github_pat_" \
            .vercel-static --exclude-dir=licenses
      - name: Deploy bundle to Vercel
        if: steps.deployment-mode.outputs.mode == 'cli'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WUKONG_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(vercel deploy . --yes --force --archive=tgz)
          [[ "$TARGET" == preview ]] && args+=(--target preview)
          [[ "$TARGET" == production ]] && args+=(--prod)
          deployment_url="$("${args[@]}" \
            --build-env "WUKONG_TELEGRAM_MINI_APP_API_URL=$WUKONG_TELEGRAM_MINI_APP_API_URL" \
            --build-env "WUKONG_RELEASE_SHA=$WUKONG_RELEASE_SHA" \
            --token "$VERCEL_TOKEN")"
          [[ "$deployment_url" == https://* ]]
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify deployed preview or production domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          domain='${{ steps.deploy.outputs.deployment_url }}'
          [[ "$TARGET" == production ]] && domain='https://wukong-rom-studio.vercel.app'
          for _ in {1..24}; do
            if [[ "$TARGET" == preview ]]; then
              response_file="$(mktemp)"
              error_file="$(mktemp)"
              vercel curl / --deployment "$domain" --token "$VERCEL_TOKEN" >"$response_file" 2>"$error_file" || true
              page="$(cat "$response_file")"
              if [[ "$_" == 1 ]]; then
                echo "Preview verification response bytes: $(wc -c <"$response_file")"
                sed -n '1,8p' "$response_file" || true
                sed -n '1,8p' "$error_file" >&2 || true
              fi
              rm -f "$response_file"
              rm -f "$error_file"
            else
              page="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$domain/?release=${WUKONG_RELEASE_SHA}" || true)"
            fi
            if grep -Fq "${WUKONG_TELEGRAM_MINI_APP_API_URL%/}" <<< "$page" \
              && grep -Fq "content=\"${WUKONG_RELEASE_SHA}\"" <<< "$page"; then
              exit 0
            fi
            sleep 5
          done
          echo "Vercel production domain did not publish the expected release." >&2
          exit 1
