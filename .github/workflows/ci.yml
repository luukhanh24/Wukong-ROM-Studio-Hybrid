name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  cloudflare-worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/cloudflare-worker/package-lock.json
      - name: Install pinned Worker dependencies
        run: npm ci
      - name: Typecheck and test the D1 control plane
        run: npm run check

  python:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Mini App test tools
        run: |
          python -m pip install -r requirements-test.txt
          npm ci --prefix telegram_mini_app
          npm test --prefix telegram_mini_app
      - name: Materialize private content test fixtures
        run: python tools/materialize_test_content.py
      - name: Run Python contract and regression tests
        run: python -m unittest discover -s tests -v

  desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: Test WinUI core
        run: dotnet test desktop/WukongStudio.Tests/WukongStudio.Tests.csproj -c Release
      - name: Build WinUI application
        run: dotnet build desktop/WukongStudio.App/WukongStudio.App.csproj -c Release

  linux-rom-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio e2fsprogs lz4 p7zip-full zstd
          python -m pip install -r requirements.txt
      - name: Bootstrap pinned Linux toolchain
        run: python -m tools.bootstrap_linux
      - name: Smoke-test Linux binaries
        run: |
          java -version
          python -m tools.smoke_linux
      - name: Run generated ROM fixture
        run: python -m tools.smoke_rom_fixture_linux

  control-plane-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: Build always-on control plane image
        shell: bash
        run: docker build --pull --tag wukong-control-plane:ci --file deploy/control-plane/Dockerfile .
      - name: Verify container preflight and unprivileged runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '[fixture]\ntype = local\nnounc = true\n' > "$RUNNER_TEMP/rclone.conf"
          docker run --rm \
            --env WUKONG_MINI_API_DOMAIN=mini-api.example.com \
            --env WUKONG_RELEASE_SHA=0000000000000000000000000000000000000000 \
            --env WUKONG_TELEGRAM_BOT_TOKEN=1234567:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --env WUKONG_TELEGRAM_ADMIN_IDS=123456789 \
            --env WUKONG_TELEGRAM_TRANSPORT=polling \
            --env WUKONG_TELEGRAM_WEB_APP_URL=https://example.github.io/Wukong/ \
            --env WUKONG_TELEGRAM_MINI_APP_API_URL=https://mini-api.example.com \
            --env WUKONG_GITHUB_REPOSITORY=owner/repository \
            --env WUKONG_GITHUB_TOKEN=github-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            --env WUKONG_RCLONE_REMOTE=fixture \
            --volume "$RUNNER_TEMP/rclone.conf:/run/secrets/rclone.conf:ro" \
            wukong-control-plane:ci \
            python -c 'import os; assert os.getuid() == 10001; print("control-plane container ready")'

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wukong_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wukong_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WUKONG_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/wukong_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install control-plane dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r deploy/control-plane/requirements.txt
      - name: Run PostgreSQL integration contract
        run: python -m unittest -v tests.test_postgres_integration

  workflow-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: Reject floating action references and tracked credentials
        shell: bash
        run: python tools/repo_guard.py
      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          for attempt in 1 2 3 4 5; do
            gh release download "v${version}" \
              --repo rhysd/actionlint \
              --pattern "$archive" \
              --output "$archive" && break
            test "$attempt" -lt 5
            sleep 2
          done
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          tar -xzf "$archive" actionlint
          ./actionlint
        env:
          GH_TOKEN: ${{ github.token }}
