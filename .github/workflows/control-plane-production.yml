name: Control Plane Production · Render + Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wukong/**"
      - "telegram_bot_daemon.py"
      - "telegram_progress.py"
      - "deploy/control-plane/**"
      - "requirements.txt"
      - "render.yaml"
      - ".github/workflows/control-plane-production.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: wukong-control-plane-production
  cancel-in-progress: false

env:
  API_URL: ${{ vars.WUKONG_TELEGRAM_MINI_APP_API_URL || 'https://wukong-mini-api.onrender.com' }}

jobs:
  validate:
    name: Test control-plane release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r deploy/control-plane/requirements.txt
      - run: python -m unittest tests.test_postgres_state tests.test_telegram_mini_api tests.test_control_plane_deployment

  deploy-render:
    name: Deploy API and bot to Render
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: render-production
      url: ${{ vars.WUKONG_TELEGRAM_MINI_APP_API_URL || 'https://wukong-mini-api.onrender.com' }}
    steps:
      - name: Trigger private Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$API_URL" == https://*.onrender.com ]]
          if [[ -n "$RENDER_DEPLOY_HOOK_URL" ]]; then
            [[ "$RENDER_DEPLOY_HOOK_URL" == https://api.render.com/deploy/* ]]
            separator='?'
            [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && separator='&'
            curl --fail --silent --show-error --request POST --max-time 30 \
              "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}" \
              > "$RUNNER_TEMP/render-deploy.json"
          else
            echo "Render deploy hook is not configured; waiting for the private Git integration auto-deploy."
          fi
      - name: Wait for exact healthy release
        shell: bash
        run: |
          set -euo pipefail
          api_url="${API_URL%/}"
          for _ in {1..120}; do
            if curl --fail --silent --show-error --connect-timeout 15 --max-time 30 "$api_url/healthz" > "$RUNNER_TEMP/render-health.json"; then
              if python - "$GITHUB_SHA" "$RUNNER_TEMP/render-health.json" <<'PY'
          import json, sys
          expected, path = sys.argv[1:]
          payload = json.load(open(path, encoding="utf-8"))
          if payload.get("status") != "ready" or payload.get("release") != expected:
              raise SystemExit(1)
          PY
              then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Render did not publish the expected healthy release." >&2
          exit 1

  deploy-mini-app:
    name: Publish Mini App after API health
    needs: deploy-render
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch private Vercel workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run telegram-mini-app-pages.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          run_id=""
          for _ in {1..12}; do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow telegram-mini-app-pages.yml \
              --branch "$GITHUB_REF_NAME" --event workflow_dispatch --limit 10 \
              --json databaseId,headSha --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" | head -n1)"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo "Vercel deployment run was not created." >&2; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
