name: Telegram Mini App · Vercel

on:
  push:
    branches: [main]
    paths:
      - "telegram_mini_app/**"
      - "tools/build_vercel_mini_app.py"
      - "tools/export_mini_app_catalog.py"
      - "content-packs/index.json"
      - "devices_sizes.json"
      - "vercel.json"
      - ".github/workflows/telegram-mini-app-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-mini-app-vercel-production
  cancel-in-progress: true

env:
  WUKONG_TELEGRAM_MINI_APP_API_URL: ${{ vars.WUKONG_TELEGRAM_MINI_APP_API_URL || 'https://wukong-mini-api.onrender.com' }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and deploy private Mini App
    runs-on: ubuntu-24.04
    environment:
      name: vercel-production
      url: https://wukong-rom-studio.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate private deployment settings
        id: deployment-mode
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$WUKONG_TELEGRAM_MINI_APP_API_URL" ]]
          [[ "$WUKONG_TELEGRAM_MINI_APP_API_URL" == https://* ]]
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "mode=cli" >> "$GITHUB_OUTPUT"
          elif [[ -z "$VERCEL_TOKEN" && -z "$VERCEL_ORG_ID" && -z "$VERCEL_PROJECT_ID" ]]; then
            echo "mode=git-integration" >> "$GITHUB_OUTPUT"
            echo "Vercel CLI secrets are absent; using the private Git integration auto-deploy."
          else
            echo "VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID must be configured together." >&2
            exit 2
          fi
      - name: Install pinned Vercel CLI
        if: steps.deployment-mode.outputs.mode == 'cli'
        run: npm install --global vercel@59.5.0
      - name: Build production bundle locally
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WUKONG_RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.deployment-mode.outputs.mode }}" == cli ]]; then
            vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
            vercel build --prod --token "$VERCEL_TOKEN"
          else
            python -m tools.build_vercel_mini_app
          fi
          ! grep -R -Ei 'github\.com|github\.io|luukhanh24|DATABASE_URL|github_pat_' .vercel-static
      - name: Deploy prebuilt bundle to Vercel
        if: steps.deployment-mode.outputs.mode == 'cli'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")"
          [[ "$deployment_url" == https://* ]]
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify stable production domain
        shell: bash
        run: |
          set -euo pipefail
          domain='https://wukong-rom-studio.vercel.app'
          for attempt in {1..24}; do
            if page="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$domain/?release=${GITHUB_SHA}")" \
              && grep -Fq "${WUKONG_TELEGRAM_MINI_APP_API_URL%/}" <<< "$page" \
              && grep -Fq "app.js?v=${GITHUB_SHA}" <<< "$page"; then
              exit 0
            fi
            sleep 5
          done
          echo "Vercel production domain did not publish the expected release." >&2
          exit 1
