name: DC Cloud · Preflight

on:
  workflow_dispatch:
    inputs:
      canary_mib:
        description: Native/multipart round-trip canary size in MiB (0 disables)
        required: false
        default: "100"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      WUKONG_DCCLOUD_MIRROR_ENABLED: "true"
      WUKONG_DCCLOUD_REMOTE: ${{ vars.WUKONG_DCCLOUD_REMOTE || 'wukong-dccloud' }}
      WUKONG_DCCLOUD_ROOT: ${{ vars.WUKONG_DCCLOUD_ROOT || 'ROM' }}
      WUKONG_DCCLOUD_SHARE_URL: ${{ vars.WUKONG_DCCLOUD_SHARE_URL }}
      WUKONG_DCCLOUD_WEBDAV_URL: ${{ vars.WUKONG_DCCLOUD_WEBDAV_URL || '' }}
      WUKONG_DCCLOUD_UPLOAD_MODE: ${{ vars.WUKONG_DCCLOUD_UPLOAD_MODE || 'multipart' }}
      WUKONG_DCCLOUD_API_URL: ${{ vars.WUKONG_DCCLOUD_API_URL || '' }}
      WUKONG_DCCLOUD_REFRESH_TOKEN: ${{ secrets.WUKONG_DCCLOUD_REFRESH_TOKEN }}
      WUKONG_DCCLOUD_CLOUDREVE_VERSION: ${{ vars.WUKONG_DCCLOUD_CLOUDREVE_VERSION }}
      WUKONG_RCLONE_CONFIG: ${{ github.workspace }}/.wkstudio/secrets/rclone.conf
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rclone
        if: ${{ vars.WUKONG_DCCLOUD_UPLOAD_MODE != 'native' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rclone

      - name: Restore private rclone config
        if: ${{ vars.WUKONG_DCCLOUD_UPLOAD_MODE != 'native' }}
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64"
          mkdir -p "$(dirname "$WUKONG_RCLONE_CONFIG")"
          umask 077
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$WUKONG_RCLONE_CONFIG"

      - name: Verify scoped WebDAV and anonymous share
        run: |
          args=(--write-test --multipart-canary-mib "${{ inputs.canary_mib }}")
          if [[ "$WUKONG_DCCLOUD_UPLOAD_MODE" != "native" ]]; then
            args+=(--config "$WUKONG_RCLONE_CONFIG")
          fi
          python tools/dccloud_preflight.py "${args[@]}"

      - name: Remove restored credentials
        if: always()
        run: rm -f "$WUKONG_RCLONE_CONFIG"
