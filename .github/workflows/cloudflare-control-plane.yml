name: Control Plane · Cloudflare Workers + D1

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      migrate:
        description: "Apply D1 migrations before deployment"
        required: true
        type: boolean
        default: true
      cutover:
        description: "Update production API origin/webhook and run the synthetic Actions job"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "deploy/cloudflare-worker/**"
      - "api/**"
      - "telegram_mini_app/**"
      - "tools/actions_control_plane.py"
      - "tools/migrate_postgres_to_d1.py"
      - ".github/actions/run-hybrid/action.yml"
      - ".github/workflows/wukong-build.yml"
      - ".github/workflows/cloudflare-control-plane.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: wukong-cloudflare-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test Worker, migration and compatibility contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/cloudflare-worker/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt -r deploy/control-plane/requirements.txt
          npm ci --prefix deploy/cloudflare-worker
          npm ci --prefix telegram_mini_app
      - name: Run Worker and migration contracts
        run: |
          npm run check --prefix deploy/cloudflare-worker
          npm test --prefix telegram_mini_app
          python -m unittest \
            tests.test_d1_migration \
            tests.test_telegram_mini_api \
            tests.test_telegram_mini_app \
            tests.test_mini_app_upgrade \
            tests.test_hybrid_channel_parity \
            tests.test_control_plane_deployment

  deploy:
    name: Deploy ${{ inputs.target || 'staging' }} Worker
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-${{ inputs.target || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target || 'staging' }}
      WUKONG_RELEASE_SHA: ${{ github.sha }}
      WUKONG_TELEGRAM_BOT_TOKEN: ${{ secrets.WUKONG_TELEGRAM_BOT_TOKEN }}
      WUKONG_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.WUKONG_TELEGRAM_WEBHOOK_SECRET }}
      WUKONG_ACTIONS_CALLBACK_SECRET: ${{ secrets.WUKONG_ACTIONS_CALLBACK_SECRET }}
      WUKONG_GITHUB_TOKEN: ${{ secrets.WUKONG_GITHUB_TOKEN }}
      WUKONG_GOOGLE_CLIENT_ID: ${{ secrets.WUKONG_GOOGLE_CLIENT_ID }}
      WUKONG_GOOGLE_CLIENT_SECRET: ${{ secrets.WUKONG_GOOGLE_CLIENT_SECRET }}
      WUKONG_GOOGLE_REFRESH_TOKEN: ${{ secrets.WUKONG_GOOGLE_REFRESH_TOKEN }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      WUKONG_RCLONE_REMOTE: ${{ vars.WUKONG_RCLONE_REMOTE }}
    defaults:
      run:
        working-directory: deploy/cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/cloudflare-worker/package-lock.json
      - run: npm ci
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$WUKONG_TELEGRAM_BOT_TOKEN"
          test -n "$WUKONG_TELEGRAM_WEBHOOK_SECRET"
          test -n "$WUKONG_ACTIONS_CALLBACK_SECRET"
          test -n "$WUKONG_GITHUB_TOKEN"
      - name: Require verified read-only migration before production deployment
        if: (inputs.target || 'staging') == 'production'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute wukong-control-plane-db \
            --remote --env production --json \
            --command "SELECT key, value FROM wukong_control_plane_metadata \
              WHERE key IN ('control_plane_mode', \
                'migration_verified_snapshot_sha256', \
                'migration_non_terminal_jobs')" \
            > "$RUNNER_TEMP/wukong-cutover-attestation.json"
          python - "$RUNNER_TEMP/wukong-cutover-attestation.json" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          def rows(value):
              if isinstance(value, dict):
                  if isinstance(value.get("results"), list):
                      yield from value["results"]
                  for item in value.values():
                      yield from rows(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from rows(item)
          values = {
              str(row.get("key")): str(row.get("value"))
              for row in rows(payload)
              if isinstance(row, dict) and row.get("key")
          }
          assert values.get("control_plane_mode") == "read_only", values
          assert values.get("migration_non_terminal_jobs") == "0", values
          assert re.fullmatch(
              r"[0-9a-f]{64}",
              values.get("migration_verified_snapshot_sha256", ""),
          ), values
          PY
      - name: Upload Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - "$RUNNER_TEMP/wukong-worker-secrets.json" <<'PY'
          import base64, configparser, json, os, sys
          names = (
              "WUKONG_TELEGRAM_BOT_TOKEN",
              "WUKONG_TELEGRAM_WEBHOOK_SECRET",
              "WUKONG_ACTIONS_CALLBACK_SECRET",
              "WUKONG_GITHUB_TOKEN",
              "WUKONG_GOOGLE_CLIENT_ID",
              "WUKONG_GOOGLE_CLIENT_SECRET",
              "WUKONG_GOOGLE_REFRESH_TOKEN",
          )
          secrets = {name: os.environ.get(name, "") for name in names}
          encoded = os.environ.get("RCLONE_CONFIG_B64", "").strip()
          if encoded:
              parser = configparser.RawConfigParser()
              parser.read_string(base64.b64decode(encoded, validate=True).decode("utf-8"))
              preferred = os.environ.get("WUKONG_RCLONE_REMOTE", "").strip().rstrip(":")
              candidates = [
                  section for section in parser.sections()
                  if parser.get(section, "type", fallback="").strip() == "drive"
              ]
              section = preferred if preferred in candidates else (candidates[0] if candidates else "")
              if section:
                  token = json.loads(parser.get(section, "token", fallback="{}"))
                  synchronized = {
                      "WUKONG_GOOGLE_CLIENT_ID": parser.get(section, "client_id", fallback="").strip(),
                      "WUKONG_GOOGLE_CLIENT_SECRET": parser.get(section, "client_secret", fallback="").strip(),
                      "WUKONG_GOOGLE_REFRESH_TOKEN": str(token.get("refresh_token") or "").strip(),
                  }
                  if all(synchronized.values()):
                      secrets.update(synchronized)
          missing = [name for name, value in secrets.items() if not value]
          if missing:
              raise SystemExit("Missing required Worker secret configuration")
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(secrets, output)
          PY
          npx wrangler secret bulk "$RUNNER_TEMP/wukong-worker-secrets.json" --env "$TARGET"
          rm -f "$RUNNER_TEMP/wukong-worker-secrets.json"
      - name: Apply D1 migrations
        if: github.event_name == 'push' || inputs.migrate
        shell: bash
        run: |
          set -euo pipefail
          database="wukong-control-plane-db"
          [[ "$TARGET" == staging ]] && database="wukong-control-plane-staging-db"
          npx wrangler d1 migrations apply "$database" --remote --env "$TARGET"
      - name: Deploy exact release
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env "$TARGET" --var "WUKONG_RELEASE_SHA:$WUKONG_RELEASE_SHA"
      - name: Verify exact healthy release
        env:
          STAGING_URL: ${{ vars.WUKONG_CLOUDFLARE_STAGING_URL }}
          PRODUCTION_URL: ${{ vars.WUKONG_CLOUDFLARE_PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          url="$STAGING_URL"
          [[ "$TARGET" == production ]] && url="$PRODUCTION_URL"
          test -n "$url"
          for _ in {1..30}; do
            if curl --fail --silent --show-error --max-time 20 "${url%/}/healthz" \
              > "$RUNNER_TEMP/worker-health.json" \
              && python - "$WUKONG_RELEASE_SHA" "$RUNNER_TEMP/worker-health.json" <<'PY'
          import json, sys
          expected, path = sys.argv[1:]
          payload = json.load(open(path, encoding="utf-8"))
          assert payload == {
              "status": "ready",
              "service": "wukong-control-plane",
              "stateBackend": "d1",
              "release": expected,
          }, payload
          PY
            then
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare Worker did not publish the expected release." >&2
          exit 1
      - name: Load-smoke staging and verify Worker CPU p95
        if: (inputs.target || 'staging') == 'staging'
        env:
          STAGING_URL: ${{ vars.WUKONG_CLOUDFLARE_STAGING_URL }}
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          python -m tools.cloudflare_load_smoke \
            --url "$STAGING_URL" \
            --script-name wukong-control-plane-staging \
            --requests 2000 \
            --concurrency 100 \
            --maximum-cpu-p95-ms 8
      - name: Bind production API origin
        if: (inputs.target || 'staging') == 'production' && inputs.cutover
        env:
          GH_TOKEN: ${{ secrets.WUKONG_GITHUB_TOKEN }}
          PRODUCTION_URL: ${{ vars.WUKONG_CLOUDFLARE_PRODUCTION_URL }}
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          gh variable set WUKONG_TELEGRAM_MINI_APP_API_URL \
            --repo "$GITHUB_REPOSITORY" --body "${PRODUCTION_URL%/}"
          gh variable set WUKONG_TELEGRAM_WEB_APP_URL \
            --repo "$GITHUB_REPOSITORY" --body "https://wukong-rom-studio.vercel.app"
      - name: Deploy Vercel bundle after production health
        if: (inputs.target || 'staging') == 'production' && inputs.cutover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          gh workflow run telegram-mini-app-pages.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$WUKONG_RELEASE_SHA" \
            --field release_sha="$WUKONG_RELEASE_SHA"
          run_id=""
          for _ in {1..20}; do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow telegram-mini-app-pages.yml \
              --branch "$GITHUB_REF_NAME" --commit "$WUKONG_RELEASE_SHA" --event workflow_dispatch --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$WUKONG_RELEASE_SHA\") | .databaseId" | head -n1)"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Verify matching Vercel source transport after frontend promotion
        if: (inputs.target || 'staging') == 'production' && inputs.cutover
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          payload='{"claimUrl":"https://invalid.example/internal/source-transport/claim","token":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
          for _ in {1..30}; do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/source-transport.json" \
              --dump-header "$RUNNER_TEMP/source-transport.headers" --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' --data "$payload" \
              https://wukong-rom-studio.vercel.app/api/source-transport || true)"
            release="$(awk 'BEGIN { IGNORECASE=1 } /^x-wukong-release:/ { gsub(/\r/, "", $2); print $2 }' \
              "$RUNNER_TEMP/source-transport.headers" | tail -n1)"
            if [[ "$status" == 403 && "$release" == "$WUKONG_RELEASE_SHA" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Vercel source transport did not publish the promoted release." >&2
          exit 1
      - name: Ensure Telegram webhook and command menu
        if: (inputs.target || 'staging') == 'production'
        env:
          PRODUCTION_URL: ${{ vars.WUKONG_CLOUDFLARE_PRODUCTION_URL }}
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(python - "$PRODUCTION_URL" "$WUKONG_TELEGRAM_WEBHOOK_SECRET" <<'PY'
          import json, sys
          url, secret = sys.argv[1:]
          print(json.dumps({
              "url": url.rstrip("/") + "/telegram/webhook",
              "secret_token": secret,
              "allowed_updates": ["message", "callback_query"],
              "drop_pending_updates": False,
          }, separators=(",", ":")))
          PY
          )" \
            "https://api.telegram.org/bot${WUKONG_TELEGRAM_BOT_TOKEN}/setWebhook")"
          python - "$response" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          assert payload.get("ok") is True, payload
          PY
          user_commands='[
            {"command":"start","description":"Mở menu Wukong ROM Studio"},
            {"command":"app","description":"Mở Mini App để cấu hình và build"},
            {"command":"jobs","description":"Xem các job gần đây"},
            {"command":"account","description":"Xem tài khoản và lượt build"},
            {"command":"cloud","description":"Xem thư viện Drive/cloud"},
            {"command":"diagnostics","description":"Kiểm tra trạng thái hệ thống"},
            {"command":"language","description":"Đổi ngôn ngữ Việt/Anh"},
            {"command":"help","description":"Xem toàn bộ lệnh"}
          ]'
          admin_commands="$(python - "$user_commands" <<'PY'
          import json, sys
          commands = json.loads(sys.argv[1])
          commands.extend([
              {"command": "users", "description": "Xem danh sách người dùng"},
              {"command": "approve", "description": "Duyệt Telegram user"},
              {"command": "revoke", "description": "Thu hồi quyền người dùng"},
              {"command": "cache", "description": "Xem GitHub Actions cache"},
              {"command": "cache_clear", "description": "Xóa GitHub Actions cache"},
          ])
          print(json.dumps(commands, ensure_ascii=False, separators=(",", ":")))
          PY
          )"
          set_commands() {
            local commands="$1"
            local scope="$2"
            response="$(curl --fail --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "$(python - "$commands" "$scope" <<'PY'
          import json, sys
          commands, scope = sys.argv[1:]
          print(json.dumps({
              "commands": json.loads(commands),
              "scope": json.loads(scope),
          }, ensure_ascii=False, separators=(",", ":")))
          PY
          )" \
              "https://api.telegram.org/bot${WUKONG_TELEGRAM_BOT_TOKEN}/setMyCommands")"
            python - "$response" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          assert payload.get("ok") is True, payload
          PY
          }
          set_commands "$user_commands" '{"type":"all_private_chats"}'
          set_commands "$admin_commands" '{"type":"chat","chat_id":1678823419}'
      - name: Run bootstrap → progress → terminal synthetic Actions job
        if: (inputs.target || 'staging') == 'production' && inputs.cutover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          job_id="synthetic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sql="$RUNNER_TEMP/wukong-synthetic.sql"
          python -m tools.seed_cloudflare_synthetic_job \
            --job-id "$job_id" \
            --source-url "https://wukong-rom-studio.vercel.app/WukongStudio.svg" \
            --output "$sql"
          (
            cd deploy/cloudflare-worker
            npx wrangler d1 execute wukong-control-plane-db \
              --remote --env production --file "$sql"
          )
          gh workflow run wukong-build.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            --field "job_id=$job_id" \
            --field "recipe_ref=worker://$job_id"
          run_id=""
          for _ in {1..20}; do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow wukong-build.yml \
              --branch "$GITHUB_REF_NAME" --event workflow_dispatch --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | startswith(\"$job_id\")) | .databaseId" | head -n1)"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          (
            cd deploy/cloudflare-worker
            npx wrangler d1 execute wukong-control-plane-db \
              --remote --env production --json \
              --command "SELECT status, manifest_json, \
                (SELECT COUNT(*) FROM wukong_actions_callback_receipts r \
                  WHERE r.job_id = j.job_id AND r.callback_kind = 'terminal') AS terminal_receipts, \
                (SELECT COUNT(*) FROM wukong_telegram_notification_outbox n \
                  WHERE n.dedupe_key = 'job-terminal:' || j.job_id) AS notifications \
                FROM wukong_jobs j WHERE job_id = '$job_id'" \
              > "$RUNNER_TEMP/wukong-synthetic-result.json"
          )
          python - "$RUNNER_TEMP/wukong-synthetic-result.json" <<'PY'
          import json, sys
          from urllib.parse import urlsplit
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          def rows(value):
              if isinstance(value, dict):
                  if isinstance(value.get("results"), list):
                      yield from value["results"]
                  for item in value.values():
                      yield from rows(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from rows(item)
          row = next((item for item in rows(payload) if item.get("status")), None)
          assert row and row["status"] == "succeeded", row
          assert int(row["terminal_receipts"]) == 1, row
          assert int(row["notifications"]) == 1, row
          manifest = json.loads(row["manifest_json"])
          urls = [
              item.get("public_url") or item.get("publicUrl")
              for item in manifest.get("artifacts", [])
          ]
          urls = [url for url in urls if url]
          assert urls, manifest
          for url in urls:
              parsed = urlsplit(url)
              assert parsed.scheme == "https", url
              assert not parsed.hostname.endswith(".workers.dev"), url
              assert parsed.hostname != "wukong-mini-api.onrender.com", url
          PY
