name: wukong-control-plane

services:
  wukong-control-plane:
    image: wukong-control-plane:${WUKONG_RELEASE_SHA:-development}
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ${WUKONG_CONTROL_PLANE_ENV_FILE:-.env}
    environment:
      WUKONG_MINI_API_DOMAIN: ${WUKONG_MINI_API_DOMAIN}
    volumes:
      - wukong-state:/var/lib/wukong
      - ./secrets/rclone.conf:/run/secrets/rclone.conf:ro
    expose:
      - "8766"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      wukong-control-plane:
        condition: service_started
    environment:
      WUKONG_MINI_API_DOMAIN: ${WUKONG_MINI_API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  wukong-state:
  caddy-data:
  caddy-config:
