name: Wukong ROM · Hybrid Build
run-name: "${{ inputs.job_id }} · Wukong Hybrid"

on:
  workflow_dispatch:
    inputs:
      recipe_ref:
        description: "Worker recipe reference or private Drive URI; leave empty for a manual recipe"
        required: false
        default: ""
        type: string
      job_id:
        description: "Stable Wukong job ID"
        required: true
        type: string
      task:
        description: "Operation"
        required: false
        default: "build"
        type: choice
        options: [build, source_mirror, artifact_publish]
      device:
        description: "Target product code"
        required: false
        default: "PKG110"
        type: string
      source_uri:
        description: "ROM HTTP(S) URL, Daniel Springer build page, or private rclone URI"
        required: false
        default: ""
        type: string
      source_sha256:
        description: "Optional ROM SHA-256 (64 hexadecimal characters)"
        required: false
        default: ""
        type: string
      source_size_bytes:
        description: "Optional exact ROM size in bytes"
        required: false
        default: ""
        type: string
      mod_version:
        description: "Private MOD content-pack version"
        required: false
        default: "ColorOS_16.0.9"
        type: string
      preset:
        description: "Build edition"
        required: false
        default: "plus"
        type: choice
        options: [lite, plus, both, custom]
      mods:
        description: "Comma-separated MOD names; empty uses preset defaults"
        required: false
        default: ""
        type: string
      enabled_steps:
        description: "Optional comma-separated pipeline steps; empty uses the complete plan"
        required: false
        default: ""
        type: string
      debloat_paths:
        description: "Optional comma-separated partition-relative paths to remove"
        required: false
        default: ""
        type: string
      execution_target:
        description: "Runner routing policy"
        required: false
        default: "github-auto"
        type: choice
        options: [github-auto, github-hosted, self-hosted-linux]
      estimated_workspace_bytes:
        description: "Optional workspace estimate; auto-calculated when empty"
        required: false
        default: ""
        type: string
      package:
        description: "Create flashable ZIP"
        required: false
        default: true
        type: boolean
      publish_artifact:
        description: "Upload successful artifact to Google Drive and create a link"
        required: false
        default: true
        type: boolean
      notify_telegram:
        description: "Send completion notification through configured Telegram settings"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: wukong-${{ inputs.job_id }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  WUKONG_RCLONE_CONFIG: ${{ github.workspace }}/.wkstudio/secrets/rclone.conf
  WUKONG_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  route:
    name: "01–02 · Kiểm tra recipe & chọn runner"
    runs-on: ubuntu-24.04
    outputs:
      runner_kind: ${{ steps.route.outputs.runner_kind }}
      recipe_digest: ${{ steps.route.outputs.recipe_digest }}
      recipe_ref: ${{ steps.route.outputs.recipe_ref }}
      mod_version: ${{ steps.route.outputs.mod_version }}
    steps:
      - name: "01.1 · Lấy mã điều phối / Checkout orchestrator"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: "01.2 · Chuẩn bị Python / Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: "01.3 · Cài bộ định tuyến / Install router"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rclone
          python -m pip install -r requirements.txt
      - name: "01.4 · Mở khóa Drive riêng tư / Restore Drive access"
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64"
          mkdir -p "$(dirname "$WUKONG_RCLONE_CONFIG")"
          umask 077
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$WUKONG_RCLONE_CONFIG"
      - name: "02 · Kiểm tra recipe & chọn runner / Validate and route"
        id: route
        env:
          RECIPE_REF: ${{ inputs.recipe_ref }}
          WUKONG_JOB_ID: ${{ inputs.job_id }}
          WUKONG_CONTROL_PLANE_API_URL: ${{ vars.WUKONG_TELEGRAM_MINI_APP_API_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          WUKONG_ACTIONS_CALLBACK_SECRET: ${{ secrets.WUKONG_ACTIONS_CALLBACK_SECRET }}
          WUKONG_RUN_ID: ${{ github.run_id }}
          WUKONG_GITHUB_TOKEN: ${{ secrets.WUKONG_GITHUB_TOKEN }}
          WUKONG_INPUT_TASK: ${{ inputs.task }}
          WUKONG_INPUT_DEVICE: ${{ inputs.device }}
          WUKONG_INPUT_SOURCE_URI: ${{ inputs.source_uri }}
          WUKONG_INPUT_SOURCE_SHA256: ${{ inputs.source_sha256 }}
          WUKONG_INPUT_SOURCE_SIZE_BYTES: ${{ inputs.source_size_bytes }}
          WUKONG_INPUT_MOD_VERSION: ${{ inputs.mod_version }}
          WUKONG_INPUT_PRESET: ${{ inputs.preset }}
          WUKONG_INPUT_MODS: ${{ inputs.mods }}
          WUKONG_INPUT_ENABLED_STEPS: ${{ inputs.enabled_steps }}
          WUKONG_INPUT_DEBLOAT_PATHS: ${{ inputs.debloat_paths }}
          WUKONG_INPUT_EXECUTION_TARGET: ${{ inputs.execution_target }}
          WUKONG_INPUT_ESTIMATED_WORKSPACE_BYTES: ${{ inputs.estimated_workspace_bytes }}
          WUKONG_INPUT_PACKAGE: ${{ inputs.package }}
          WUKONG_INPUT_PUBLISH_ARTIFACT: ${{ inputs.publish_artifact }}
          WUKONG_INPUT_NOTIFY_TELEGRAM: ${{ inputs.notify_telegram }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          job_id = os.environ['WUKONG_JOB_ID']
          if not job_id.isascii() or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]{0,63}', job_id):
              raise SystemExit('job_id must contain only ASCII letters, numbers and hyphens (max 64)')
          PY
          if [[ "$RECIPE_REF" == worker://* ]]; then
            test -n "$WUKONG_CONTROL_PLANE_API_URL"
            python -m tools.actions_control_plane bootstrap \
              --api-url "$WUKONG_CONTROL_PLANE_API_URL" \
              --job-id "$WUKONG_JOB_ID" \
              --run-id "$WUKONG_RUN_ID" \
              --github-token "$GITHUB_TOKEN" \
              --secret "$WUKONG_ACTIONS_CALLBACK_SECRET" \
              --output .wkstudio/actions-bootstrap.json \
              --recipe-output .wkstudio/recipe.json
            effective_recipe_ref="wukong-gdrive:WukongROM/recipes/${WUKONG_JOB_ID}.json"
            rclone copyto .wkstudio/recipe.json "$effective_recipe_ref" \
              --config "$WUKONG_RCLONE_CONFIG" --retries 3
          elif [ -n "$RECIPE_REF" ]; then
            python -m tools.fetch_recipe "$RECIPE_REF" --output .wkstudio/recipe.json --rclone-config "$WUKONG_RCLONE_CONFIG" --coerce-github
            effective_recipe_ref="$RECIPE_REF"
          else
            python -m tools.materialize_workflow_recipe --output .wkstudio/recipe.json
            effective_recipe_ref="wukong-gdrive:WukongROM/recipes/${WUKONG_JOB_ID}.json"
            rclone copyto .wkstudio/recipe.json "$effective_recipe_ref" --config "$WUKONG_RCLONE_CONFIG" --retries 3
          fi
          if ! python wukong_cli.py validate --recipe .wkstudio/recipe.json > .wkstudio/route.json; then
            cat .wkstudio/route.json
            exit 2
          fi
          printf 'recipe_ref=%s\n' "$effective_recipe_ref" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open('.wkstudio/route.json', encoding='utf-8'))
          print(f"runner_kind={data['runner']['kind']}")
          print(f"recipe_digest={data['recipeDigest']}")
          recipe = json.load(open('.wkstudio/recipe.json', encoding='utf-8'))
          print(f"mod_version={recipe['build']['modVersion']}")
          PY
          {
            echo "## 01–02 · Recipe preflight & runner route"
            echo ""
            echo "| Mục / Field | Giá trị / Value |"
            echo "|---|---|"
            echo "| Job | \`$WUKONG_JOB_ID\` |"
            python - <<'PY'
          import json
          data = json.load(open('.wkstudio/route.json', encoding='utf-8'))
          recipe = json.load(open('.wkstudio/recipe.json', encoding='utf-8'))
          print(f"| Device | `{recipe['device']}` |")
          print(f"| Task | `{recipe['task']}` |")
          print(f"| Requested route | `{recipe['execution']['target']}` |")
          print(f"| Selected runner | **{data['runner']['kind']}** |")
          print(f"| Recipe SHA-256 | `{data['recipeDigest']}` |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  hosted:
    name: "03–19 · Build trên GitHub Hosted"
    needs: route
    if: needs.route.outputs.runner_kind == 'github-hosted'
    runs-on: ubuntu-24.04
    outputs:
      executor_started: ${{ steps.hybrid.outputs.executor_started }}
    steps:
      - name: "03 · Mở rộng workspace / Expand hosted disk"
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          # On the current GitHub image, /mnt shares the root filesystem.
          # The action's second loop image therefore consumes root space down
          # to temp-reserve-mb, regardless of the earlier root reserve.
          root-reserve-mb: 12288
          temp-reserve-mb: 8192
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - name: "03.1 · Lấy mã điều phối / Checkout orchestrator"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: "03.2 · Chuẩn bị Python / Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: "03.3 · Chuẩn bị Java 17 / Set up Java"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: "03.4 · Khôi phục toolchain cache / Restore tools"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bin/Linux
          key: wukong-linux-tools-${{ runner.os }}-${{ hashFiles('tools/linux-x86_64.json', 'tools/bootstrap_linux.py') }}
      - name: "04 · Khôi phục content cache / Restore shared content"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            MOD
            STARK
            Flash_script
            copy-image
            OFX
            TWRP
          key: wukong-content-${{ needs.route.outputs.mod_version }}-${{ hashFiles('content-packs/index.json') }}
      - name: "04.1 · Kiểm tra dung lượng runner / Verify runner disk split"
        shell: bash
        run: >-
          python3 -m tools.runner_preflight
          --path "$GITHUB_WORKSPACE"
          --min-disk-gib 70
          --root-path /
          --min-root-disk-gib 4
          --min-memory-gib 0
          --min-cpus 0
      - name: "05–19 · Chạy pipeline ROM / Execute ROM pipeline"
        id: hybrid
        uses: ./.github/actions/run-hybrid
        with:
          recipe_ref: ${{ needs.route.outputs.recipe_ref }}
          job_id: ${{ inputs.job_id }}
          rclone_config_b64: ${{ secrets.RCLONE_CONFIG_B64 }}
          github_token: ${{ secrets.WUKONG_GITHUB_TOKEN }}
          control_plane_api_url: ${{ vars.WUKONG_TELEGRAM_MINI_APP_API_URL }}
          actions_callback_secret: ${{ secrets.WUKONG_ACTIONS_CALLBACK_SECRET }}
          github_run_id: ${{ github.run_id }}
          self_hosted: "false"
      - name: "19.1 · Chuyển manifest cho callback / Transfer terminal manifest"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wukong-control-plane-${{ inputs.job_id }}
          path: |
            .wkstudio/Jobs/hybrid/${{ inputs.job_id }}/manifest.json
            .wkstudio/Jobs/hybrid/${{ inputs.job_id }}/events.jsonl
          if-no-files-found: ignore
          retention-days: 1

  self-hosted:
    name: "03–19 · Build trên Wukong self-hosted"
    needs: route
    if: needs.route.outputs.runner_kind == 'self-hosted'
    runs-on: [self-hosted, linux, x64, wukong-rom]
    outputs:
      executor_started: ${{ steps.hybrid.outputs.executor_started }}
    steps:
      - name: "03.1 · Lấy mã điều phối / Checkout orchestrator"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          clean: true
      - name: "03 · Kiểm tra CPU, RAM, disk / Runner preflight"
        run: python3 -m tools.runner_preflight
      - name: "04–19 · Chạy pipeline ROM / Execute ROM pipeline"
        id: hybrid
        uses: ./.github/actions/run-hybrid
        with:
          recipe_ref: ${{ needs.route.outputs.recipe_ref }}
          job_id: ${{ inputs.job_id }}
          rclone_config_b64: ${{ secrets.RCLONE_CONFIG_B64 }}
          github_token: ${{ secrets.WUKONG_GITHUB_TOKEN }}
          control_plane_api_url: ${{ vars.WUKONG_TELEGRAM_MINI_APP_API_URL }}
          actions_callback_secret: ${{ secrets.WUKONG_ACTIONS_CALLBACK_SECRET }}
          github_run_id: ${{ github.run_id }}
          self_hosted: "true"
      - name: "19.1 · Chuyển manifest cho callback / Transfer terminal manifest"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wukong-control-plane-${{ inputs.job_id }}
          path: |
            .wkstudio/Jobs/hybrid/${{ inputs.job_id }}/manifest.json
            .wkstudio/Jobs/hybrid/${{ inputs.job_id }}/events.jsonl
          if-no-files-found: ignore
          retention-days: 1

  notify-control-plane:
    name: "20 · Đánh thức Mini App & báo kết quả"
    needs: [route, hosted, self-hosted]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: "20.0 · Lấy mã callback / Checkout callback client"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: "20.0 · Nhận manifest / Download terminal manifest"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: wukong-control-plane-${{ inputs.job_id }}
          path: .wkstudio/Jobs/hybrid/${{ inputs.job_id }}
      - name: "20 · Đồng bộ kết quả / Wake control plane"
        env:
          API_URL: ${{ vars.WUKONG_TELEGRAM_MINI_APP_API_URL }}
          CALLBACK_SECRET: ${{ secrets.WUKONG_ACTIONS_CALLBACK_SECRET }}
          WUKONG_JOB_ID: ${{ inputs.job_id }}
          WUKONG_RUN_ID: ${{ github.run_id }}
          ROUTE_RESULT: ${{ needs.route.result }}
          RUNNER_KIND: ${{ needs.route.outputs.runner_kind }}
          HOSTED_RESULT: ${{ needs.hosted.result }}
          SELF_HOSTED_RESULT: ${{ needs.self-hosted.result }}
          HOSTED_EXECUTOR_STARTED: ${{ needs.hosted.outputs.executor_started }}
          SELF_HOSTED_EXECUTOR_STARTED: ${{ needs.self-hosted.outputs.executor_started }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$API_URL" || -z "$CALLBACK_SECRET" ]]; then
            echo "Control plane is not bound yet; skipping terminal callback."
            exit 0
          fi
          api_url="${API_URL%/}"
          [[ "$api_url" == https://* ]]
          read -r workflow_result pre_executor_failure < <(python - <<'PY'
          import os
          route = os.environ.get("ROUTE_RESULT", "")
          runner = os.environ.get("RUNNER_KIND", "")
          selected = (
              os.environ.get("HOSTED_RESULT", "")
              if runner == "github-hosted"
              else os.environ.get("SELF_HOSTED_RESULT", "")
          )
          executor_started = (
              os.environ.get("HOSTED_EXECUTOR_STARTED", "")
              if runner == "github-hosted"
              else os.environ.get("SELF_HOSTED_EXECUTOR_STARTED", "")
          )
          result = route if route != "success" else selected
          if result not in {"success", "failure", "cancelled"}:
              result = "failure"
          pre_executor = route != "success" or executor_started != "true"
          print(result, "true" if pre_executor else "false")
          PY
          )
          args=(
            --api-url "$api_url"
            --job-id "$WUKONG_JOB_ID"
            --run-id "$WUKONG_RUN_ID"
            --secret "$CALLBACK_SECRET"
            --workflow-result "$workflow_result"
          )
          manifest=".wkstudio/Jobs/hybrid/$WUKONG_JOB_ID/manifest.json"
          events=".wkstudio/Jobs/hybrid/$WUKONG_JOB_ID/events.jsonl"
          [[ -f "$manifest" ]] && args+=(--manifest "$manifest")
          [[ -f "$events" ]] && args+=(--events "$events")
          [[ "$pre_executor_failure" == true ]] && args+=(--pre-executor-failure)
          python -m tools.actions_control_plane terminal "${args[@]}" || \
            echo "::warning title=20 · Control-plane callback::The ROM result is already stored on Drive, but the terminal callback did not complete."
