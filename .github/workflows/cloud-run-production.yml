name: Cloud Run Production · API + Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wukong/**"
      - "telegram_bot_daemon.py"
      - "telegram_progress.py"
      - "deploy/cloud-run/**"
      - "deploy/control-plane/requirements.txt"
      - "requirements.txt"
      - ".github/workflows/cloud-run-production.yml"
      - ".github/workflows/wukong-build.yml"

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: wukong-cloud-run-production
  cancel-in-progress: false

env:
  REGION: asia-southeast1
  SERVICE: wukong-mini-api
  ARTIFACT_REPOSITORY: wukong
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  API_URL: ${{ vars.WUKONG_CLOUD_RUN_API_URL }}

jobs:
  validate:
    name: Test stateless control plane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r deploy/control-plane/requirements.txt
      - run: python -m unittest discover -s tests
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$API_URL" == https://*.run.app ]]

  deploy:
    name: Publish API to Cloud Run
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: cloud-run-production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Build immutable container image
        shell: bash
        run: |
          set -euo pipefail
          registry="$REGION-docker.pkg.dev"
          image="$registry/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/control-plane:$GITHUB_SHA"
          gcloud auth configure-docker "$registry" --quiet
          docker build --file deploy/cloud-run/Dockerfile --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --execution-environment=gen2
            --service-account=wukong-runtime@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --cpu=2
            --memory=2Gi
            --concurrency=40
            --min=0
            --max=2
            --timeout=300
            --cpu-throttling
            --cpu-boost
            --port=8080
            --set-env-vars=^@^GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }}@WUKONG_RELEASE_SHA=${{ github.sha }}@WUKONG_TELEGRAM_TRANSPORT=webhook@WUKONG_TELEGRAM_MANAGE_WEBHOOK=false@WUKONG_TELEGRAM_ADMIN_IDS=1678823419@WUKONG_TELEGRAM_WEB_APP_URL=https://wukong-rom-studio.vercel.app/@WUKONG_ALLOWED_ORIGINS=https://wukong-rom-studio.vercel.app@WUKONG_TELEGRAM_MINI_APP_API_URL=${{ env.API_URL }}@WUKONG_GITHUB_REPOSITORY=${{ github.repository }}@WUKONG_CLOUD_TASKS_LOCATION=${{ env.REGION }}@WUKONG_CLOUD_TASKS_SERVICE_ACCOUNT=wukong-tasks@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com@WUKONG_CONTROL_PLANE_REQUIRE_POSTGRES=true@WUKONG_CONTROL_PLANE_BACKGROUND_WATCHERS=false@WUKONG_CONTROL_PLANE_ONLINE_PREFLIGHT=0@WUKONG_CONTROL_PLANE_STATE_BACKUP_ENABLED=false@WUKONG_DATABASE_POOL_MAX=8@WUKONG_RCLONE_REMOTE=wukong-gdrive@WUKONG_RCLONE_CONFIG=/run/secrets/rclone.conf
            --set-secrets=DATABASE_URL=wukong-database-url:latest,WUKONG_TELEGRAM_BOT_TOKEN=wukong-telegram-bot-token:latest,WUKONG_GITHUB_TOKEN=wukong-github-token:latest,WUKONG_ACTIONS_CALLBACK_SECRET=wukong-actions-callback-secret:latest,/run/secrets/rclone.conf=wukong-rclone-config:latest
      - name: Verify exact healthy revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.deploy.outputs.url }}" == "$API_URL" ]]
          for attempt in {1..36}; do
            if curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
              "$API_URL/healthz?release=$GITHUB_SHA&attempt=$attempt" > "$RUNNER_TEMP/health.json" \
              && python - "$GITHUB_SHA" "$RUNNER_TEMP/health.json" <<'PY'
          import json, sys
          expected, path = sys.argv[1:]
          payload = json.load(open(path, encoding="utf-8"))
          if payload.get("status") != "ready":
              raise SystemExit(1)
          if payload.get("release") != expected:
              raise SystemExit(1)
          if payload.get("stateBackend") != "postgresql":
              raise SystemExit(1)
          PY
            then
              break
            fi
            [[ "$attempt" != 36 ]] || exit 1
            sleep 5
          done
  publish-mini-app:
    name: Publish Mini App after Cloud Run health
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Vercel workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh variable set WUKONG_TELEGRAM_MINI_APP_API_URL \
            --repo "$GITHUB_REPOSITORY" --body "$API_URL"
          gh workflow run telegram-mini-app-pages.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          run_id=""
          for _ in {1..12}; do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow telegram-mini-app-pages.yml \
              --branch "$GITHUB_REF_NAME" --event workflow_dispatch --limit 10 \
              --json databaseId,headSha --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" | head -n1)"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]]
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

  cutover-telegram:
    name: Switch Telegram webhook after Vercel health
    needs: publish-mini-app
    runs-on: ubuntu-24.04
    environment:
      name: cloud-run-production
      url: ${{ env.API_URL }}
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Configure Telegram through authenticated Cloud Task
        shell: bash
        run: |
          set -euo pipefail
          task_id="telegram-config-${GITHUB_SHA:0:16}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud tasks create-http-task "$task_id" \
            --queue=wukong-telegram \
            --location="$REGION" \
            --url="$API_URL/internal/tasks/configure-telegram" \
            --method=POST \
            --header=Content-Type=application/json \
            --body-content="{\"release\":\"$GITHUB_SHA\"}" \
            --oidc-service-account-email="wukong-tasks@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --oidc-token-audience="$API_URL"
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              "$API_URL/healthz?telegram-configuration=$attempt" > "$RUNNER_TEMP/health.json" \
              && python - "$GITHUB_SHA" "$RUNNER_TEMP/health.json" <<'PY'
          import json
          import sys
          expected, path = sys.argv[1:]
          payload = json.load(open(path, encoding="utf-8"))
          if payload.get("telegramConfigurationRelease") != expected:
              raise SystemExit(1)
          PY
            then
              exit 0
            fi
            [[ "$attempt" != 24 ]] || {
              echo "Telegram configuration task did not complete within two minutes." >&2
              exit 1
            }
            sleep 5
          done
